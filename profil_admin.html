<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin | PAGARNUSA UNUSIA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1B7548',
                        primaryDark: '#145c38'
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .sidebar-link.active { background-color: #145c38; color: white !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row">

    <aside class="w-full md:w-64 bg-primary text-white flex flex-col shadow-xl z-20">
        <div class="p-6 border-b border-white/10 flex items-center space-x-3">
            <img src="logopn.png" alt="Logo" class="h-10">
            <div>
                <h1 class="text-sm font-bold uppercase tracking-wider">Dashboard</h1>
                <p class="text-[10px] opacity-70">Admin Pagar Nusa</p>
            </div>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" data-content-id="content-ringkasan" class="sidebar-link active flex items-center space-x-3 px-4 py-3 rounded-lg transition hover:bg-white/10">
                <i class="fas fa-chart-pie w-5"></i>
                <span class="text-sm font-medium">Ringkasan</span>
            </a>
            <a href="#" data-content-id="content-kelola-peserta" class="sidebar-link flex items-center space-x-3 px-4 py-3 rounded-lg transition hover:bg-white/10">
                <i class="fas fa-users w-5"></i>
                <span class="text-sm font-medium">Kelola Peserta</span>
            </a>
            <button id="download-csv" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition hover:bg-white/10 text-left">
                <i class="fas fa-file-csv w-5"></i>
                <span class="text-sm font-medium">Ekspor Data CSV</span>
            </button>
        </nav>

        <div class="p-4 border-t border-white/10">
            <button id="logout-button" class="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition flex items-center justify-center space-x-2">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto h-screen p-4 md:p-8">
        
        <div id="dashboard-content">
            <div id="content-ringkasan" class="space-y-6">
                <h2 class="text-2xl font-bold text-slate-800">Ringkasan Pendaftaran</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500">
                        <p class="text-xs text-slate-500 font-bold uppercase mb-1">Total Pending</p>
                        <h3 id="stat-pending" class="text-3xl font-bold text-slate-800">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                        <p class="text-xs text-slate-500 font-bold uppercase mb-1">Total Lolos</p>
                        <h3 id="stat-kualifikasi" class="text-3xl font-bold text-slate-800">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
                        <p class="text-xs text-slate-500 font-bold uppercase mb-1">Diskualifikasi</p>
                        <h3 id="stat-diskualifikasi" class="text-3xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
            </div>

            <div id="content-kelola-peserta" class="hidden space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <h2 class="text-2xl font-bold text-slate-800">Data Peserta UKT</h2>
                    
                    <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                        <input type="text" id="participant-search" placeholder="Cari nama..." 
                            class="px-4 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                        <select id="status-filter" class="px-4 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none">
                            <option value="all">Semua Status</option>
                            <option value="Pending">Pending</option>
                            <option value="Kualifikasi">Kualifikasi</option>
                            <option value="Diskualifikasi">Diskualifikasi</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4">Nama Peserta</th>
                                    <th class="px-6 py-4">Angkatan</th>
                                    <th class="px-6 py-4">Status</th>
                                    <th class="px-6 py-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="participants-table-body" class="divide-y divide-slate-100">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let allStudents = JSON.parse(localStorage.getItem('allStudentsData')) || [];

            // 1. Render Statistik
            function renderStats() {
                document.getElementById('stat-pending').textContent = allStudents.filter(s => s.status.includes('Pending')).length;
                document.getElementById('stat-kualifikasi').textContent = allStudents.filter(s => s.status.includes('Kualifikasi')).length;
                document.getElementById('stat-diskualifikasi').textContent = allStudents.filter(s => s.status.includes('Diskualifikasi')).length;
            }

            // 2. Render Tabel Peserta
            function renderTable() {
                const tbody = document.getElementById('participants-table-body');
                const searchTerm = document.getElementById('participant-search').value.toLowerCase();
                const statusFilter = document.getElementById('status-filter').value;

                tbody.innerHTML = '';

                const filtered = allStudents.filter(s => {
                    const matchName = s.nama.toLowerCase().includes(searchTerm);
                    const matchStatus = (statusFilter === 'all' || s.status.includes(statusFilter));
                    return matchName && matchStatus;
                });

                filtered.forEach((s, index) => {
                    const statusClass = s.status.includes('Kualifikasi') ? 'bg-green-100 text-green-700' : 
                                      s.status.includes('Diskualifikasi') ? 'bg-red-100 text-red-700' : 
                                      'bg-yellow-100 text-yellow-700';

                    const row = `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-6 py-4">
                                <div class="font-semibold text-slate-800">${s.nama}</div>
                                <div class="text-xs text-slate-500">${s.email}</div>
                            </td>
                            <td class="px-6 py-4 text-slate-600">${s.angkatan}</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${statusClass}">
                                    ${s.status}
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex justify-center space-x-2">
                                    <button onclick="updateStatus('${s.email}', 'Kualifikasi')" class="p-2 bg-green-500 text-white rounded hover:bg-green-600 title="Loloskan">
                                        <i class="fas fa-check"></i>
                                    </button>
                                    <button onclick="updateStatus('${s.email}', 'Diskualifikasi')" class="p-2 bg-red-500 text-white rounded hover:bg-red-600" title="Diskualifikasi">
                                        <i class="fas fa-times"></i>
                                    </button>
                                    <button onclick="updateStatus('${s.email}', 'Pending')" class="p-2 bg-yellow-500 text-white rounded hover:bg-yellow-600" title="Reset ke Pending">
                                        <i class="fas fa-undo"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }

            // 3. Update Status Logic
            window.updateStatus = (email, newStatus) => {
                const index = allStudents.findIndex(s => s.email === email);
                if (index !== -1) {
                    allStudents[index].status = newStatus;
                    // Simpan ke localStorage agar sinkron dengan profil_siswa.html
                    localStorage.setItem('allStudentsData', JSON.stringify(allStudents));
                    renderStats();
                    renderTable();
                }
            };

            // 4. Sidebar Navigasi
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    
                    const target = link.getAttribute('data-content-id');
                    document.querySelectorAll('#dashboard-content > div').forEach(div => div.classList.add('hidden'));
                    document.getElementById(target).classList.remove('hidden');
                    
                    if(target === 'content-kelola-peserta') renderTable();
                });
            });

            // 5. Search & Filter Listener
            document.getElementById('participant-search').addEventListener('input', renderTable);
            document.getElementById('status-filter').addEventListener('change', renderTable);

            // 6. Ekspor CSV
            document.getElementById('download-csv').addEventListener('click', () => {
                let csv = 'Nama,Email,Angkatan,Ujian,Status\n';
                allStudents.forEach(s => {
                    csv += `${s.nama},${s.email},${s.angkatan},${s.ujian},${s.status}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('href', url);
                a.setAttribute('download', 'Data_Peserta_UKT.csv');
                a.click();
            });

            // 7. Logout
            document.getElementById('logout-button').addEventListener('click', () => {
                localStorage.removeItem('currentUserProfile');
                window.location.href = 'login.html';
            });

            // Initial Run
            renderStats();
        });
    </script>
</body>
</html>
